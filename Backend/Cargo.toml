[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["fs", "full", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "uuid", "chrono"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.5", features = ["cors", "fs", "limit", "trace"] }
tower = "0.5.2"
axum-macros = "0.5.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["blocking", "json", "multipart", "rustls-tls"] }
argon2 = "0.5"
jsonwebtoken = "9"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
anyhow = "1"
tower-cookies = "0.9"
hyper = "1.6.0"
bs58 = "0.5.1"
async-trait = "0.1.88"
bytes = "1.10.1"
